<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReVeste</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
<header>
  <h1>ReVeste</h1>
  <p>Uma peça, uma nova história</p>
  <nav>
    <a href="index.html">Início</a>
    <a href="cadastro.html">Cadastro</a>
    <a href="doacoes.html">Doar</a>
    <a href="roupas.html">Roupas disponíveis</a>
  </nav>
</header>
<main>
<h2>Doar roupas</h2>
<p>Doe roupas limpas e em bom estado.</p>
<form>
  <label>Seu nome</label>
  <input type="text">

  <label>Telefone (WhatsApp)</label>
  <input type="tel">

  <label>Tipo de roupa</label>
  <select>
    <option>Bebê</option>
    <option>Infantil</option>
    <option>Adulto</option>
    <option>Agasalho</option>
    <option>Calçado</option>
  </select>

  <label>Quantidade de peças</label>
  <input type="number">

  <label>Tamanho</label>
  <input type="text">

  <label>Como vai entregar?</label>
  <select>
    <option>Vou levar ao CRAS</option>
    <option>Preciso que busquem</option>
  </select>

  <button type="submit">Enviar doação</button>
</form>
</main>
<footer>ReVeste, em parceria com o CRAS</footer>
</body>
</html>
